<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vantedge Member Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ink:#0c0e1e;
    --box:#0c0e1e;
    --tile:#13162a;
    --line:#2c3048;
    --line-soft:#1e2136;
    --text:#f8f7f3;
    --muted:#a9acbd;
    --dim:#7c8098;
    --cream:#dfdcc9;
    --callout:#ede9e0;
    --ok:#8fbf9f;
    --ok-bg:rgba(143,191,159,.12);
    --warn:#d9b872;
    --warn-bg:rgba(217,184,114,.12);
    --bad:#d98a86;
    --bad-bg:rgba(217,138,134,.12);
    --display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --body:'Lato', 'Helvetica Neue', Arial, sans-serif;
    --logo:'Times New Roman', Times, serif;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{background:#08091a}
  body{margin:0;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- Top bar ---------- */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,9,20,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
  .top-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .wordmark{font-family:var(--logo);font-weight:400;color:var(--cream);letter-spacing:.42em;font-size:18px;white-space:nowrap}
  .wordmark small{display:block;font-family:var(--body);letter-spacing:.24em;font-size:9.5px;color:var(--dim);margin-top:2px;text-transform:uppercase}
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:1px solid transparent;border-radius:8px;padding:8px 14px;color:var(--muted);font-size:13px;letter-spacing:.06em;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{color:var(--text);background:var(--box);border-color:var(--line)}
  .tab .lk{font-size:11px;opacity:.8}
  .top-r{display:flex;align-items:center;gap:12px}
  .viewswitch{display:flex;background:var(--box);border:1px solid var(--line);border-radius:999px;padding:3px}
  .viewswitch button{background:none;border:0;border-radius:999px;padding:5px 12px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .viewswitch button[aria-pressed="true"]{background:var(--tile);color:var(--cream)}
  .me{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
  .av{width:36px;height:36px;border-radius:50%;background:var(--tile);border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--cream);letter-spacing:.04em}
  .me-t{text-align:left;line-height:1.3;font-size:12.5px}
  .me-t b{display:block;font-weight:700;color:var(--text)}
  .me-t span{color:var(--dim)}

  /* ---------- Layout ---------- */
  main{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:36px 96px}
  .view{display:flex;flex-direction:column;gap:28px}
  .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream)}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .head h1{font-size:clamp(28px,4vw,40px);margin-top:8px}
  .head p{color:var(--muted);margin:8px 0 0;max-width:62ch}
  .box{background:var(--box);border:1px solid var(--line);border-radius:var(--r);padding:26px}
  .box h2{font-size:21px}
  .box-h{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .box-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

  /* ---------- Buttons & chips ---------- */
  .btn{border-radius:9px;padding:11px 18px;font-size:13px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line);background:var(--tile);color:var(--text);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:border-color .15s, background .15s}
  .btn:hover{border-color:var(--cream)}
  .btn.primary{background:var(--cream);color:var(--ink);border-color:var(--cream)}
  .btn.primary:hover{background:var(--callout)}
  .btn.ghost{background:transparent}
  .btn.danger{background:transparent;color:var(--bad);border-color:rgba(217,138,134,.45)}
  .btn.danger:hover{border-color:var(--bad)}
  .btn.sm{padding:7px 12px;font-size:12px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
  .chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
  .chip.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
  .chip.cream{color:var(--cream);border-color:var(--line)}

  /* ---------- Callout ---------- */
  .callout{background:var(--callout);color:var(--ink);border-radius:var(--r);padding:20px 24px;display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap}
  .callout b{font-family:var(--display);font-size:18px;display:block;margin-bottom:2px}
  .callout p{margin:0;font-size:14px;max-width:64ch}
  .callout .btn.primary{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .callout .btn.primary:hover{background:#13162a}
  .callout.revoked{background:var(--bad-bg);color:var(--text);border:1px solid rgba(217,138,134,.4)}
  .callout.revoked b{color:var(--bad)}

  /* ---------- Profile card ---------- */
  .pid{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
  .pid .av{width:64px;height:64px;font-size:20px;font-family:var(--display)}
  .pid h2{font-size:26px}
  .pid .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kv div{background:var(--tile);border-radius:10px;padding:12px 14px;min-width:0}
  .kv dt{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .kv dd{margin:0;font-size:14.5px;overflow-wrap:anywhere}
  .kv dd b{color:var(--cream);font-weight:700}

  /* ---------- Checklist ---------- */
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .step{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;background:var(--tile);border-radius:10px;padding:12px 14px}
  .step .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;color:var(--muted)}
  .step.done .n{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:700}
  .step .t{font-size:14.5px}
  .step .s{font-size:12.5px;color:var(--dim)}
  .step.done .t{color:var(--muted)}
  .prog{height:6px;background:var(--tile);border-radius:999px;overflow:hidden;margin:4px 0 18px}
  .prog span{display:block;height:100%;background:var(--cream);border-radius:999px;transition:width .3s}

  /* ---------- Contacts ---------- */
  .contacts{display:flex;flex-direction:column;gap:10px}
  .ct{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:10px;padding:12px 14px}
  .ct .av{width:34px;height:34px;font-size:11.5px}
  .ct .who{flex:1;min-width:0;line-height:1.35}
  .ct .who b{display:block;font-size:14px}
  .ct .who span{font-size:12.5px;color:var(--dim)}

  /* ---------- Resources ---------- */
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .fbtn{background:var(--box);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted)}
  .fbtn[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:700}
  .res-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .res{background:var(--box);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;min-height:190px}
  .res .rtype{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .res h3{font-size:17.5px}
  .res p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
  .res .rf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--dim)}
  .res.locked h3,.res.locked p{filter:blur(3.5px);user-select:none}
  .res.locked .rtype span:first-child{filter:none}
  .lockover{position:absolute;inset:0;display:grid;place-items:center;border-radius:var(--r);pointer-events:none}
  .lockbadge{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;letter-spacing:.08em;color:var(--cream);display:flex;gap:8px;align-items:center}
  .res.locked .rf .btn{pointer-events:auto}
  .empty{color:var(--dim);font-size:14px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}

  /* ---------- Profile form ---------- */
  .form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .field input,.field select{background:var(--tile);border:1px solid var(--line);border-radius:9px;padding:11px 13px;width:100%;min-width:0}
  .field input:disabled,.field select:disabled{opacity:1;color:var(--muted);background:#0f1124;border-color:var(--line-soft)}
  .field .hint{font-size:12px;color:var(--dim)}
  .field.full{grid-column:1/-1}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
  .err{color:var(--bad);font-size:13px;min-height:1em}

  /* ---------- Agreement ---------- */
  .doc{background:var(--tile);border-radius:10px;padding:24px 26px;max-height:380px;overflow:auto;border:1px solid var(--line-soft)}
  .doc h3{font-size:16px;margin:20px 0 6px;color:var(--cream)}
  .doc h3:first-child{margin-top:0}
  .doc p{margin:0;color:var(--text);font-size:14px;max-width:68ch}
  .checks{display:flex;flex-direction:column;gap:12px;margin:22px 0}
  .ck{display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer}
  .ck input{width:18px;height:18px;margin-top:2px;accent-color:#dfdcc9;flex:0 0 auto}
  .sigwrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .pad{position:relative;background:var(--ink);border:1px dashed var(--line);border-radius:10px;height:170px;touch-action:none}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;cursor:crosshair}
  .pad .ph{position:absolute;left:18px;right:18px;bottom:36px;border-bottom:1px solid var(--line);pointer-events:none}
  .pad .phx{position:absolute;left:18px;bottom:40px;font-family:var(--display);color:var(--dim);pointer-events:none}
  .pad .phh{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;pointer-events:none}
  .signed-rec{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
  .signed-rec img{background:var(--ink);border-radius:10px;border:1px solid var(--line);width:240px;max-width:100%;height:auto}

  /* ---------- Admin ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .stat{background:var(--box);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
  .stat .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .stat .v{font-family:var(--display);font-size:32px;margin-top:4px}
  .tablewrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line-soft)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
  th{background:var(--tile);text-align:left;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px}
  td{padding:13px 14px;border-top:1px solid var(--line-soft);vertical-align:middle}
  td .nm b{display:block}
  td .nm span{font-size:12px;color:var(--dim)}
  .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .confirm{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:12.5px;color:var(--bad)}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,5,12,.85);z-index:50;display:grid;place-items:center;padding:20px}
  .modal{background:var(--box);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
  .modal.sm{width:min(460px,100%)}
  .mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-soft)}
  .mh h2{font-size:18px}
  .mh .x{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;color:var(--muted);font-size:18px;line-height:1}
  .mb{padding:22px;overflow:auto}
  .mf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
  .page{position:relative;background:#f8f7f3;color:#0c0e1e;border-radius:6px;aspect-ratio:210/297;max-width:100%;width:420px;margin:0 auto;padding:36px 34px;overflow:hidden}
  .page .pw{font-family:var(--logo);letter-spacing:.38em;font-size:11px;color:#4a4f6a}
  .page h3{font-size:22px;margin:26px 0 8px;color:#0c0e1e}
  .page .pl{height:8px;border-radius:4px;background:#d6d4ca;margin:9px 0}
  .page .sec{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#4a4f6a;margin-top:22px}
  .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .wm span{transform:rotate(-32deg);font-size:15px;letter-spacing:.14em;color:rgba(12,14,30,.14);white-space:nowrap;font-weight:700}
  .slots{display:flex;flex-direction:column;gap:10px}
  .slot{background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:13px 16px;text-align:left;display:flex;justify-content:space-between;gap:10px}
  .slot[aria-pressed="true"]{border-color:var(--cream);box-shadow:inset 0 0 0 1px var(--cream)}
  .slot span{color:var(--dim);font-size:13px}

  /* ---------- Toast & flag ---------- */
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--callout);color:var(--ink);padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .mockflag{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:8px;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .mockflag button{background:var(--tile);border:0;border-radius:999px;padding:5px 10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream)}

  footer.foot{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:28px 60px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12.5px}
  footer.foot .tag{font-family:Georgia,'Times New Roman',serif;font-weight:700;color:var(--cream);font-size:15px}

  @media (max-width:980px){
    .grid2,.sigwrap,.signed-rec{grid-template-columns:1fr}
    .res-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .me-t{display:none}
  }
  @media (max-width:620px){
    .top-in{padding:12px 16px;gap:12px}
    .tabs{order:3;flex-basis:100%}
    .top-r{margin-left:auto}
    main,footer.foot{padding-inline:16px}
    .box{padding:20px}
    .kv,.form,.res-grid{grid-template-columns:1fr}
    .step{grid-template-columns:30px 1fr;}
    .step .btn{grid-column:2;justify-self:start}
    .page{padding:26px 22px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="wordmark">VANTEDGE<small>Member Portal</small></div>
    <nav class="tabs" role="tablist" id="tabs" aria-label="Portal sections"></nav>
    <div class="top-r">
      <div class="viewswitch" role="group" aria-label="View as">
        <button type="button" id="vAnalyst" aria-pressed="true">Member</button>
        <button type="button" id="vAdmin" aria-pressed="false">Admin</button>
      </div>
      <button type="button" class="me" id="meBtn" aria-label="Open my profile">
        <span class="av" id="meAv">AT</span>
        <span class="me-t"><b id="meName">Aiden Tan</b><span id="meRole">M&amp;A Analyst</span></span>
      </button>
    </div>
  </div>
</header>

<main id="main"></main>

<footer class="foot">
  <span class="tag">Earn Your AdVANTEDGE</span>
  <span>Vantedge: a global finance ecosystem · Access is personal and ends when you leave the team</span>
</footer>

<div class="mockflag">Mock · sample data <button type="button" id="resetBtn">Reset demo</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
(function(){
  /* ============ STATE ============ */
  const CONTACTS = {
    'M&A': [['Madhav','Co-Founder · Co-Head of M&A Advisory'],['Diego','Head of M&A']],
    'Equity Research': [['Mustafa','Head of Equity Research'],['Andrew','Editor-in-Chief']],
    'DCM': [['Aniya','Co-Founder · Head of DCM']],
    'ECM': [['Xuenna','Founder & Executive Director']],
    'Growth': [['Zhannel','Head of Marketing & Growth'],['Charles','Deputy Head of Growth & Strategy']]
  };
  const DIVISIONS = {Research:['M&A','Equity Research','DCM','ECM'], Growth:['Growth']};
  const ROLES = {Research:['Analyst','Senior Analyst','Head of Division'], Growth:['Partnerships & Outreach','Marketing & Social','Growth & Strategy']};

  const RESOURCES = [
    {id:'ma-readme', t:'M&A Analyst README', d:'How the three deliverables and progression gates fit together. Start here.', div:'M&A', type:'Handbook', pages:8, secs:['The three deliverables','Progression gates','Your first report']},
    {id:'ma-hb', t:'M&A Analyst Handbook', d:'The three research lenses: Advisory Pitch, Deconstruct the Deal, Industry Flow Report.', div:'M&A', type:'Handbook', pages:30, secs:['The three lenses','Synergy risk-weighting','Research cycle workflow']},
    {id:'ma-menu', t:'M&A Content Menu', d:'Short-form LinkedIn formats, unlocked after your first published report.', div:'M&A', type:'Handbook', pages:12, secs:['Formats','House style','Approval flow']},
    {id:'ma-tpl', t:'M&A Report Template', d:'Publication-ready A4 template that all three lenses share.', div:'M&A', type:'Template', pages:16, secs:['Cover','Executive summary','Valuation approach']},
    {id:'fm-hb', t:'Financial Modeling Handbook', d:'3-statement, comps, DCF, LBO and merger models. Unlocked after your third report.', div:'M&A', type:'Handbook', pages:40, secs:['3-statement model','DCF','LBO']},
    {id:'er-readme', t:'ER README', d:'One flagship deliverable, two tracks: solo or team.', div:'Equity Research', type:'Handbook', pages:8, secs:['The flagship report','Track A: solo','Track B: team']},
    {id:'er-hb', t:'ER Research Handbook', d:'From historicals to forecasting, DCF, comps and the final report.', div:'Equity Research', type:'Handbook', pages:28, secs:['Historicals','Forecasting','Writing the thesis']},

  let sigStrokes = 0;
  function setupPad(){
    const c = $('#sig'); if(!c) return;
    const pad = $('#pad'); const ctx = c.getContext('2d');
    const size = () => { const r = pad.getBoundingClientRect(); const dpr = window.devicePixelRatio||1;
      c.width = r.width*dpr; c.height = r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#dfdcc9'; };
    size(); sigStrokes = 0;
    let drawing=false, last=null;
    const pt = ev => { const r=c.getBoundingClientRect(); return {x:ev.clientX-r.left, y:ev.clientY-r.top}; };
    c.addEventListener('pointerdown', ev => { drawing=true; last=pt(ev); c.setPointerCapture(ev.pointerId); $('#padHint').hidden=true; ctx.beginPath(); ctx.arc(last.x,last.y,1,0,Math.PI*2); ctx.fillStyle='#dfdcc9'; ctx.fill(); sigStrokes++; });
    c.addEventListener('pointermove', ev => { if(!drawing) return; const p=pt(ev); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
    const end = () => { drawing=false; };
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end); c.addEventListener('pointerleave', end);
    $('#clearSig').onclick = () => { ctx.clearRect(0,0,c.width,c.height); sigStrokes=0; $('#padHint').hidden=false; };
  }

              <td>${esc(m.vertical)}</td><td>${esc(m.division)} · ${esc(m.role)}</td><td>${esc(m.chapter)}</td>
              <td class="num">${m.signed?esc(m.signed):'<span style="color:var(--dim)">Not signed</span>'}</td>
              <td>${statusChip(m.status)}</td><td>${act}</td></tr>`;}).join('')}</tbody>
        </table></div></section>`;
  }
  function library(){
    const all = allMembers();
    const divs = ['M&A','Equity Research','DCM','ECM','Growth','All'];
    return `
      <div class="head"><div><div class="eyebrow">Admin · Library</div><h1>Who can open what</h1>
      <p>Materials are matched to each member's division. General materials go to everyone who has signed.</p></div></div>
      <div class="res-grid">${divs.map(d=>{
        const items = RESOURCES.filter(r=>r.div===d);
        const who = all.filter(m=>m.status==='active' && (d==='All' || m.division===d));
        return `<article class="res"><div class="rtype"><span>${d==='All'?'General':esc(d)}</span><span class="num">${items.length} items</span></div>
          <h3>${d==='All'?'All members':esc(d)}</h3>
          <p>${items.map(i=>esc(i.t)).join(', ')}</p>
          <div class="rf"><span>${who.length?who.map(w=>esc(w.name)).join(', '):'No active members'}</span><span class="chip ${who.length?'ok':''} num">${who.length} with access</span></div></article>`;
      }).join('')}</div>`;
  }

  /* ============ MODALS ============ */
  let viewer = null;
  function openViewer(id){
    const r = RESOURCES.find(x=>x.id===id); if(!r||!hasAccess()) return;
    viewer = {r, page:0};
    if(r.div===S.profile.division || (S.profile.division==='Growth' && r.id==='gr-onb')) { if(!S.handbookRead){ S.handbookRead=true; } }
    drawViewer();
  }
  function drawViewer(){
    const {r,page} = viewer; const total = r.secs.length+1; const p = S.profile;
    const body = page===0
      ? `<div class="pw">VANTEDGE</div><h3>${esc(r.t)}</h3><div class="sec">${esc(r.type)} · ${esc(r.div==='All'?'All members':r.div)}</div>
         <div class="pl" style="width:88%;margin-top:18px"></div><div class="pl" style="width:74%"></div>
         <div class="sec" style="margin-top:34px">Contents</div>${r.secs.map((s,i)=>`<div style="font-size:13px;margin-top:8px">${i+1}. ${esc(s)}</div>`).join('')}`
      : `<div class="pw">VANTEDGE</div><div class="sec">Section ${page}</div><h3>${esc(r.secs[page-1])}</h3>
         ${[92,86,95,70,0,90,82,88,64,0,93,78].map(w=>w?`<div class="pl" style="width:${w}%"></div>`:'<div style="height:14px"></div>').join('')}`;
    modal(`
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vh">
        <div class="mh"><div><h2 id="vh">${esc(r.t)}</h2><div class="hint" style="color:var(--dim);font-size:12.5px">View only · downloads off · preview pages</div></div><button type="button" class="x" data-close aria-label="Close">×</button></div>
        <div class="mb" style="background:var(--tile)"><div class="page">${body}<div class="wm"><span>${esc(p.name)} · ${esc(p.memberId)} · Vantedge confidential</span></div></div></div>
        <div class="mf"><button type="button" class="btn sm" data-page="-1" ${page===0?'disabled':''}>Previous</button>
          <span class="num" style="color:var(--muted);font-size:13px">Page ${page+1} of ${total}</span>
          <button type="button" class="btn sm" data-page="1" ${page===total-1?'disabled':''}>Next</button></div>
      </div>`);
  }
  let pickedSlot = null;
  function openBooking(){
    pickedSlot = S.call;
    modal(`
      <div class="modal sm" role="dialog" aria-modal="true" aria-labelledby="bh">
        <div class="mh"><h2 id="bh">Book your onboarding call</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
        <div class="mb"><p style="margin:0 0 16px;color:var(--muted);font-size:14px">30 minutes with your division leads over Google Meet. Pick a slot.</p>
          <div class="slots">${SLOTS.map(s=>`<button type="button" class="slot" data-slot="${esc(s)}" aria-pressed="${pickedSlot===s}">${esc(s)}<span>30 min</span></button>`).join('')}</div></div>
        <div class="mf"><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" id="bookYes" ${pickedSlot?'':'disabled'}>Confirm slot</button></div>
      </div>`);
  }
  function openMessage(name){
    modal(`
      <div class="modal sm" role="dialog" aria-modal="true" aria-labelledby="mh2">
        <div class="mh"><h2 id="mh2">Message ${esc(name)}</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
        <form class="mb" id="mform" novalidate><div class="field"><label for="f-msg">Your message</label>
          <textarea id="f-msg" rows="5" style="background:var(--tile);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--text);font:inherit;resize:vertical" placeholder="Hi ${esc(name)}, quick question about my first report..."></textarea></div>
          <div class="err" id="merr" style="margin-top:10px"></div></form>
        <div class="mf"><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" id="sendMsg" data-to="${esc(name)}">Send</button></div>
      </div>`);
    setTimeout(()=>$('#f-msg')?.focus(),30);
  }
  function modal(html){ $('#modalRoot').innerHTML = `<div class="scrim" id="scrim">${html}</div>`; }
  function closeModal(){ $('#modalRoot').innerHTML=''; viewer=null; render(); }

  /* ============ RENDER ============ */
  function render(){
    renderTabs();
    const m = $('#main');
    const views = {dashboard, profile, resources, agreement, members, library};
    m.innerHTML = `<div class="view">${(views[S.tab]||dashboard)()}</div>`;
    if(S.tab==='agreement' && !S.signed) setupPad();
  }

  /* ============ EVENTS ============ */
  document.addEventListener('click', e => {
    const t = e.target.closest('button,[data-close]'); if(!t) { if(e.target.id==='scrim') closeModal(); return; }
    if(t.dataset.tab){ go(t.dataset.tab); return; }
    if(t.dataset.go){ if(document.getElementById('scrim')) $('#modalRoot').innerHTML=''; go(t.dataset.go); return; }
    if(t.dataset.filter){ S.filter=t.dataset.filter; render(); return; }
    if(t.dataset.open){ openViewer(t.dataset.open); return; }
    if(t.dataset.page){ const n = viewer.page + (+t.dataset.page); viewer.page = Math.max(0, Math.min(viewer.r.secs.length, n)); drawViewer(); return; }
    if('close' in t.dataset){ closeModal(); return; }
    if(t.dataset.act==='book'){ openBooking(); return; }
    if(t.dataset.slot){ pickedSlot=t.dataset.slot; document.querySelectorAll('.slot').forEach(s=>s.setAttribute('aria-pressed', s.dataset.slot===pickedSlot)); $('#bookYes').disabled=false; return; }
    if(t.id==='bookYes'){ S.call=pickedSlot; closeModal(); toast(`Onboarding call booked for ${S.call}`); return; }
    if(t.dataset.msg){ openMessage(t.dataset.msg); return; }
    if(t.id==='sendMsg'){ const v=$('#f-msg').value.trim(); if(!v){ $('#merr').textContent='Write a message before sending.'; return; } $('#modalRoot').innerHTML=''; toast(`Message to ${t.dataset.to} saved (mock, not delivered)`); return; }
    if(t.id==='vAnalyst'){ S.view='member'; S.tab='dashboard'; S.confirmRevoke=null; render(); return; }
    if(t.id==='vAdmin'){ S.view='admin'; S.tab='members'; render(); return; }
    if(t.id==='meBtn'){ S.view='member'; go('profile'); return; }
    if(t.id==='editBtn'){ S.editing=true; render(); setTimeout(()=>$('#f-preferred')?.focus(),20); return; }
    if(t.id==='cancelBtn'){ S.editing=false; render(); return; }
    if(t.id==='confirmBtn'){ S.profileConfirmed=true; render(); toast('Details confirmed'); return; }
    if(t.id==='resetBtn'){ S=freshState(); $('#modalRoot').innerHTML=''; render(); window.scrollTo({top:0}); toast('Demo reset'); return; }
    if(t.dataset.revoke){ S.confirmRevoke=t.dataset.revoke; render(); return; }
    if('revokeNo' in t.dataset){ S.confirmRevoke=null; render(); return; }
    if(t.dataset.revokeYes){ setStatus(t.dataset.revokeYes,'revoked'); S.confirmRevoke=null; render(); toast('Access revoked. Materials are now closed for this member.'); return; }
    if(t.dataset.restore){ setStatus(t.dataset.restore,'restore'); render(); toast('Access restored'); return; }
    if(t.dataset.remind){ toast(`Reminder queued for ${t.dataset.remind} (mock)`); return; }
  });
  function setStatus(id, action){
    if(id===S.profile.memberId){ S.revoked = action==='revoked'; return; }
    const m = S.others.find(x=>x.id===id); if(!m) return;
    if(action==='revoked'){ m.status='revoked'; m.note='Offboarded today'; }
    else { m.status = m.signed ? 'active' : 'pending'; m.note=null; }
  }
  document.addEventListener('submit', e => {
    e.preventDefault();
    if(e.target.id==='pform'){
      const g = id => $('#f-'+id).value.trim();
      const email = g('email'), phone = g('phone');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ $('#perr').textContent='Enter a valid email address, like name@university.edu.'; return; }
      if(!/^\+\d[\d\s-]{6,}$/.test(phone)){ $('#perr').textContent='Start your phone number with + and the country code, like +60 12-345 6789.'; return; }
      Object.assign(S.profile,{preferred:g('preferred'),email,phone,university:g('university'),chapter:$('#f-chapter').value,timezone:g('timezone'),linkedin:g('linkedin')});
      S.editing=false; S.profileConfirmed=true; render(); toast('Details saved');
    }
    if(e.target.id==='sform'){
      const err = $('#serr');
      if(!$('#c1').checked || !$('#c2').checked){ err.textContent='Tick both boxes to confirm you agree.'; return; }
      if($('#f-typed').value.trim().toLowerCase() !== S.profile.name.toLowerCase()){ err.textContent=`Type your full name exactly as it appears on your profile: ${S.profile.name}.`; return; }
      if(sigStrokes < 1){ err.textContent='Draw your signature in the box.'; return; }
      S.sig = $('#sig').toDataURL('image/png'); S.signed=true; S.signedAt=nowStamp();
      render(); window.scrollTo({top:0,behavior:'smooth'}); toast('Signed. Your resources are unlocked.');
    }
  });
  document.addEventListener('keydown', e => { if(e.key==='Escape' && document.getElementById('scrim')) closeModal(); });

  render();
})();
</script>
</body>
</html>
